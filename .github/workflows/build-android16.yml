name: Build Android16 Kernel

on:
  workflow_dispatch:
    inputs:
      rom_source:
        description: "ROM Kernel Source Code"
        required: true
        type: choice
        options:
          - YAAP
          - LineageOS
          - Crdroid
          - PixelOS

      ksu_type:
        description: "KernelSU Version"
        required: true
        type: choice
        options:
          - KernelSU-Official
          - BakaSU
          - KernelSU-Next
          - KernelSU-Official-susfs
          - KernelSU-Next-susfs
          - BakaSU-susfs
          - None

      ksu_branch:
        description: "KernelSU branch (empty = default; BakaSU example: sync-up)"
        required: false
        type: string
        default: ""

      susfs_dev:
        description: "Use SUSFS android14-6.1 dev branch (off = stable)"
        required: false
        type: boolean
        default: false

      netfilter:
        description: "Enable IPSET & IPv6_NAT"
        required: true
        type: boolean
        default: true

      ccm:
        description: "Enable BBR & ECN"
        required: true
        type: boolean
        default: true

      droidspaces:
        description: "Droidspaces Container Support"
        required: true
        type: choice
        options:
          - "none"
          - "standard"
          - "extended"

      docker:
        description: "⚠️ DANGER: Docker support (namespaces/cgroup v2/USER_NS/overlay/btrfs). May bootloop some devices! No bridge/nftables/IPVS/CFS_BANDWIDTH (confirmed bootloop on sm8650)."
        required: true
        type: boolean
        default: false

      kernel_name:
        description: "Custom Kernel Name"
        required: false
        type: string
        default: ""

      create_release:
        description: "Create GitHub Release"
        required: true
        type: boolean
        default: true

permissions:
  actions: read
  checks: read
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build-kernel.yml
    with:
      android_version: 16
      rom_source: ${{ inputs.rom_source }}
      ksu_type: ${{ inputs.ksu_type }}
      ksu_branch: ${{ inputs.ksu_branch }}
      susfs_dev: ${{ inputs.susfs_dev }}
      netfilter: ${{ inputs.netfilter }}
      ccm: ${{ inputs.ccm }}
      droidspaces: ${{ inputs.droidspaces }}
      docker: ${{ inputs.docker }}
      kernel_name: ${{ inputs.kernel_name }}
      create_release: ${{ inputs.create_release }}
    secrets: inherit
