name: Build Android17 Kernel

on:
  workflow_dispatch:
    inputs:
      rom_source:
        description: "Android 17 Kernel Source Code"
        required: true
        type: choice
        options:
          - YAAP
          - DerpFest
          - LineageOS
          - FrierenKernel
          - Crdroid
          - AOSPA

      ksu_type:
        description: "KernelSU Version"
        required: true
        type: choice
        options:
          - KernelSU-Official
          - BakaSU
          - KernelSU-Next
          - KernelSU-Official-susfs
          - KernelSU-Next-susfs
          - BakaSU-susfs
          - None

      ksu_branch:
        description: "KernelSU branch (empty = default; BakaSU example: sync-up)"
        required: false
        type: string
        default: ""

      susfs_dev:
        description: "Use SUSFS android14-6.1 dev branch (off = stable)"
        required: false
        type: boolean
        default: false

      droidspaces:
        description: "Droidspaces Container Support"
        required: true
        type: choice
        options:
          - "none"
          - "standard"
          - "extended"

      netfilter:
        description: "Enable IPSET & IPv6_NAT"
        required: true
        type: boolean
        default: true

      ccm:
        description: "Enable BBR & ECN"
        required: true
        type: boolean
        default: true

      docker:
        description: "⚠️ DANGER: Docker support (namespaces/cgroup v2/USER_NS/overlay/btrfs). May bootloop some devices! No bridge/nftables/IPVS/CFS_BANDWIDTH (confirmed bootloop on sm8650)."
        required: true
        type: boolean
        default: false

      kernel_name:
        description: "Custom Kernel Name"
        required: false
        type: string
        default: ""

      create_release:
        description: "Create GitHub Release"
        required: true
        type: boolean
        default: true

permissions:
  actions: read
  checks: read
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build-kernel.yml
    with:
      android_version: 17
      rom_source: ${{ inputs.rom_source }}
      ksu_type: ${{ inputs.ksu_type }}
      ksu_branch: ${{ inputs.ksu_branch }}
      susfs_dev: ${{ inputs.susfs_dev }}
      netfilter: ${{ inputs.rom_source != 'FrierenKernel' && inputs.netfilter }}
      ccm: ${{ inputs.rom_source != 'FrierenKernel' && inputs.ccm }}
      droidspaces: ${{ inputs.rom_source != 'YAAP' && inputs.droidspaces || 'none' }}
      docker: ${{ inputs.docker }}
      kernel_name: ${{ inputs.kernel_name }}
      create_release: ${{ inputs.create_release }}
    secrets: inherit
