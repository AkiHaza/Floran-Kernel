name: Build Kernel Core

on:
  workflow_call:
    inputs:
      rom_source:
        description: ROM Kernel Source Code
        required: true
        type: string

      ksu_type:
        description: "KernelSU Version"
        required: true
        type: string

      lz4_enable:
        description: "Enable lz4 1.10.0 patch"
        required: true
        type: boolean

      netfilter:
        description: "Enable IPSET & IPv6_NAT"
        required: true
        type: boolean

      ccm:
        description: "Enable BBR & ECN"
        required: true
        type: boolean

      droidspaces:
        description: "Droidspaces Container Support"
        required: true
        type: string

      kernel_name:
        description: "Custom Kernel Name"
        required: false
        type: string
        default: ""

      create_release:
        description: "创建 GitHub Release？"
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev libdw-dev build-essential lz4 git python3 curl dwarves cpio gcc-aarch64-linux-gnu busybox

      - name: Test YAAP-17 installer
        if: inputs.rom_source == 'YAAP-17'
        run: |
          BUSYBOX=$(command -v busybox) python3 -m unittest discover -s tests -v

      - name: Clone Kernel Source and Download Clang Toolchain
        run: |
          if [[ "${{ inputs.rom_source }}" == "YAAP-16" ]]; then
            git clone --depth=1 -b sixteen https://github.com/AkiHaza/android_kernel_oneplus_sm8650.git sm8650
            git clone --depth=1 -b sixteen https://github.com/AkiHaza/android_kernel_oneplus_sm8650-modules.git sm8650-modules

          elif [[ "${{ inputs.rom_source }}" == "YAAP-17" ]]; then
            YAAP_KERNEL_BRANCH=seventeen
            git clone --depth=1 -b "$YAAP_KERNEL_BRANCH" https://github.com/AkiHaza/android_kernel_oneplus_sm8650.git sm8650
            git clone --depth=1 -b "$YAAP_KERNEL_BRANCH" https://github.com/AkiHaza/android_kernel_oneplus_sm8650-modules.git sm8650-modules

          elif [[ "${{ inputs.rom_source }}" == "DerpFest" ]]; then
            git clone --depth=1 -b lineage-23.2 https://github.com/ppanzenboeck/android_kernel_oneplus_sm8650.git sm8650
            git clone --depth=1 -b derp16.2-arb https://github.com/ppanzenboeck/android_kernel_oneplus_sm8650-modules.git sm8650-modules

          elif [[ "${{ inputs.rom_source }}" == "LineageOS" ]]; then
            git clone --depth=1 -b lineage-23.2 https://github.com/LineageOS/android_kernel_oneplus_sm8650.git sm8650
            git clone --depth=1 -b lineage-23.2 https://github.com/LineageOS/android_kernel_oneplus_sm8650-modules.git sm8650-modules

          elif [[ "${{ inputs.rom_source }}" == "Crdroid" ]]; then
            git clone --depth=1 -b 16.0 https://github.com/crdroidandroid/android_kernel_oneplus_sm8650.git sm8650
            git clone --depth=1 -b 16.0 https://github.com/crdroidandroid/android_kernel_oneplus_sm8650-modules.git sm8650-modules

          elif [[ "${{ inputs.rom_source }}" == "PixelOS" ]]; then
            git clone --depth=1 -b sixteen-qpr2 https://github.com/PixelOS-Devices/android_kernel_oneplus_sm8650.git sm8650
            git clone --depth=1 -b sixteen-qpr2 https://github.com/PixelOS-Devices/android_kernel_oneplus_sm8650-modules.git sm8650-modules

          fi

          if [[ "${{ inputs.rom_source }}" == "YAAP-17" || "${{ inputs.rom_source }}" == "DerpFest" ]]; then
            CLANG_VERSION="clang-r596125"
            CLANG_URL="https://github.com/AkiHaza/Floran-Kernel/releases/download/toolchain-r596125/linux-x86-refs_heads_android17-release-clang-r596125.tar.gz"
          else
            CLANG_VERSION="clang-r563880c"
            CLANG_URL="https://github.com/AkiHaza/Floran-Kernel/releases/download/toolchain-r563880c/linux-x86-refs_heads_android16-qpr2-release-clang-r563880c.tar.gz"
          fi

          mkdir -p "toolchains/${CLANG_VERSION}"
          cd toolchains
          echo "Downloading ${CLANG_VERSION} from ${CLANG_URL}"
          curl -fL --retry 3 --retry-delay 2 -o "${CLANG_VERSION}.tar.gz" "${CLANG_URL}"
          tar -xf "${CLANG_VERSION}.tar.gz" -C "${CLANG_VERSION}"
          {
            echo "### Clang toolchain"
            echo "- Version: ${CLANG_VERSION}"
            echo "- Download: ${CLANG_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Apply lz4 patch
        if: inputs.lz4_enable && inputs.rom_source != 'YAAP-16' && inputs.rom_source != 'YAAP-17'
        run: |
          cd sm8650
          patch_file=../patch/lz4.patch
          if [[ "${{ inputs.rom_source }}" == "LineageOS" || "${{ inputs.rom_source }}" == "DerpFest" ]]; then
            patch_file=../patch/lz4-lineage.patch
            echo "Using the Android 6.1 compatible LZ4 patch for ${{ inputs.rom_source }}."
          fi

          if [[ "${{ inputs.rom_source }}" == "LineageOS" || "${{ inputs.rom_source }}" == "DerpFest" ]]; then
            git apply --check -p1 < "$patch_file"
            git apply -p1 < "$patch_file"
            test -f include/linux/lz4.h
            test -f lib/lz4/lz4.c
            test -f lib/lz4/lz4armv8/lz4accel.h
            echo "LZ4 1.10.0 Android 6.1 patch applied to ${{ inputs.rom_source }} (generic C fallback)."
          else
            git apply -p1 < "$patch_file" || true
            mkdir -p lib/lz4/lz4armv8
            cp ../patch/lz4opt.S lib/lz4/lz4armv8/lz4armv8.S
          fi

      - name: Apply Droidspaces patches
        if: inputs.droidspaces != 'none' && inputs.rom_source != 'YAAP-16' && inputs.rom_source != 'YAAP-17'
        run: |
          cd sm8650

          echo ">>> 正在添加 Droidspaces 容器支持..."
          # 开启 Droidspaces 容器所需内核支持
          echo "CONFIG_PID_NS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_IPC_NS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USER_NS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_SYSVIPC=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_DEVTMPFS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NAMESPACES=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_POSIX_MQUEUE=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> ./arch/arm64/configs/gki_defconfig
          # 开启 NTSync
          echo "CONFIG_NTSYNC=y" >> ./arch/arm64/configs/gki_defconfig

          # 应用 Droidspaces 容器必须补丁
          echo ">>> 应用 Droidspaces 补丁..."
          if [[ "${{ inputs.rom_source }}" == "DerpFest" ]]; then
            patch -p1 -F 3 < ../patch/fix_sysvipc_kabi_6_7_8.patch
            patch -p1 -F 3 < ../patch/ntsync_base.patch
            patch -p1 -F 3 < ../patch/ntsync_compat_android14-6.1.patch
            echo "Droidspaces patches applied to DerpFest."
          else
            patch -p1 -F 3 < ../patch/fix_sysvipc_kabi_6_7_8.patch || true
            patch -p1 -F 3 < ../patch/ntsync_base.patch || true
            patch -p1 -F 3 < ../patch/ntsync_compat_android14-6.1.patch || true
          fi

      - name: Apply Droidspaces Extended patches
        if: inputs.droidspaces == 'extended' && inputs.rom_source != 'YAAP-16' && inputs.rom_source != 'YAAP-17'
        run: |
          cd sm8650

          echo ">>> 正在启用容器环境扩展支持..."
          # 开启虚拟 HCI 设备支持
          echo "CONFIG_BT_HCIVHCI=y" >> arch/arm64/configs/gki_defconfig
          # 开启 systemd-coredump 支持
          echo "CONFIG_STATIC_USERMODEHELPER=n" >> arch/arm64/configs/gki_defconfig
          # 添加 Lindroid EVDI DRM 驱动
          echo "CONFIG_DRM_LINDROID_EVDI=y" >> arch/arm64/configs/gki_defconfig

          # 应用 EVDI DRM 补丁
          if [[ "${{ inputs.rom_source }}" == "DerpFest" ]]; then
            patch -p1 -F 3 < ../patch/evdi_drm.patch
            echo "Droidspaces Extended patch applied to DerpFest."
          else
            patch -p1 -F 3 < ../patch/evdi_drm.patch || true
          fi

      - name: Fix extract-cert key_pass compatibility
        if: inputs.rom_source != 'YAAP-16'
        run: |
          cd sm8650
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("certs/extract-cert.c")
          text = path.read_text()
          guard = r"(?:#ifdef\s+USE_PKCS11_ENGINE|#if\s+defined\s*\(\s*USE_PKCS11_ENGINE\s*\))"
          declaration = re.compile(
              rf"(?m)^(?P<indent>[ \t]*){guard}[ \t]*\r?\n"
              r"(?P<body>[ \t]*)static\s+const\s+char\s+\*\s*key_pass\s*;[ \t]*\r?\n"
              r"(?P=indent)#endif[ \t]*(?:\r?\n|$)"
          )
          assignment = re.compile(
              rf"(?m)^(?P<indent>[ \t]*){guard}[ \t]*\r?\n"
              r"(?P<body>[ \t]*)key_pass\s*=\s*getenv\s*\(\s*"
              r"\"KBUILD_SIGN_PIN\"\s*\)\s*;[ \t]*\r?\n"
              r"(?P=indent)#endif[ \t]*(?:\r?\n|$)"
          )

          text, declaration_count = declaration.subn(
              lambda match: f"{match.group('body')}static const char *key_pass;\n",
              text,
              count=1,
          )
          text, assignment_count = assignment.subn(
              lambda match: f'{match.group("body")}key_pass = getenv("KBUILD_SIGN_PIN");\n',
              text,
              count=1,
          )

          if declaration_count or assignment_count:
              path.write_text(text)
              print("Fixed extract-cert.c key_pass guards")
          else:
              print("extract-cert.c key_pass layout is already compatible")
          PY

      - name: Compile Kernel
        run: |
          if [[ "${{ inputs.rom_source }}" == "YAAP-17" || "${{ inputs.rom_source }}" == "DerpFest" ]]; then
            CLANG_VERSION="clang-r596125"
          else
            CLANG_VERSION="clang-r563880c"
          fi
          CLANG_ROOT="${GITHUB_WORKSPACE}/toolchains/${CLANG_VERSION}/bin"
          export PATH="${CLANG_ROOT}:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang CXX=clang++ HOSTCC=clang HOSTCXX=clang++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          echo "Using ${CLANG_VERSION}: $(clang --version | head -n 1)"

          cd sm8650

          if [[ "${{ inputs.ksu_type }}" == KernelSU-Official* ]]; then
            curl -fLSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

          elif [[ "${{ inputs.ksu_type }}" == KernelSU-Next-susfs ]]; then
            curl -fLSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs

          elif [[ "${{ inputs.ksu_type }}" == KernelSU-Next ]]; then
            curl -fLSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s main

          elif [[ "${{ inputs.ksu_type }}" == ReSukiSU* ]]; then
            curl -fLSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          fi

          if [[ "${{ inputs.ksu_type }}" == *susfs ]]; then
            # Apply the original SUSFS gki-android14-6.1 patch from simonpunk.
            git clone --depth=1 -b gki-android14-6.1 https://gitlab.com/simonpunk/susfs4ksu.git susfs
            cd susfs
            cp ./kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ..
            cp ./kernel_patches/fs/* ../fs/
            cp ./kernel_patches/include/linux/* ../include/linux/
            cd ..

            # Preserve rejects from optional patches that ran earlier.  The
            # inline repair validates only rejects created by SUSFS.
            find . -type f -name '*.rej' -print > ../susfs-rejects-before.txt
            patch_status=0
            patch --batch --forward -p1 < 50_add_susfs_in_gki-android14-6.1.patch || patch_status=$?
            if [[ "${patch_status}" -gt 1 ]]; then
              echo "SUSFS patch command failed with a fatal error (status ${patch_status})."
              exit "${patch_status}"
            fi

            repair_susfs_file() {
              local target="$1"
              local add_cl_copy="$2"
              local fix_file
              local needs_fix=false

              if [[ ! -f "${target}" ]] || ! grep -Eq 'susfs_is_|DEFAULT_KSU_MNT_|susfs_mnt_' "${target}"; then
                echo "SUSFS functional code is missing from ${target}."
                exit 1
              fi

              # Remove declarations used by older SUSFS revisions before
              # installing the declarations required by the current patch.
              sed -i -E \
                -e '/^[[:space:]]*extern[[:space:]]+bool[[:space:]]+susfs_is_current_ksu_domain/d' \
                -e '/^[[:space:]]*extern[[:space:]]+bool[[:space:]]+susfs_is_sdcard_android_data_(not_)?decrypted/d' \
                "${target}"

              fix_file="$(mktemp)"
              echo '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT' > "${fix_file}"
              if ! grep -Eq '^#include[[:space:]]+<linux/susfs_def.h>' "${target}"; then
                echo '#include <linux/susfs_def.h>' >> "${fix_file}"
                needs_fix=true
              fi
              if ! grep -Eq '^#include[[:space:]]+<linux/jump_label.h>' "${target}"; then
                echo '#include <linux/jump_label.h>' >> "${fix_file}"
                needs_fix=true
              fi
              if ! grep -Eq '^[[:space:]]*(extern[[:space:]]+)?bool[[:space:]]+susfs_is_current_ksu_domain[[:space:]]*\([[:space:]]*void[[:space:]]*\)[[:space:]]*;' "${target}"; then
                echo 'extern bool susfs_is_current_ksu_domain(void);' >> "${fix_file}"
                needs_fix=true
              fi
              if ! grep -Eq '^[[:space:]]*(extern[[:space:]]+)?struct[[:space:]]+static_key_(true|false)[[:space:]]+susfs_is_sdcard_android_data_not_decrypted[[:space:]]*;' "${target}"; then
                echo 'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;' >> "${fix_file}"
                needs_fix=true
              fi
              if [[ "${add_cl_copy}" == true ]] && ! grep -Eq '^#define[[:space:]]+CL_COPY_MNT_NS[[:space:]]+BIT\(25\)' "${target}"; then
                echo '#ifndef CL_COPY_MNT_NS' >> "${fix_file}"
                echo '#define CL_COPY_MNT_NS BIT(25)' >> "${fix_file}"
                echo '#endif' >> "${fix_file}"
                needs_fix=true
              fi
              echo '#endif' >> "${fix_file}"

              if [[ "${needs_fix}" == true ]]; then
                if ! grep -q '#include "internal.h"' "${target}"; then
                  echo "Could not find the include insertion point in ${target}."
                  rm -f "${fix_file}"
                  exit 1
                fi
                sed -i "/#include \"internal.h\"/r ${fix_file}" "${target}"
                echo "Repaired SUSFS declarations in ${target}."
              fi
              rm -f "${fix_file}"
            }

            repair_susfs_file fs/namespace.c true
            repair_susfs_file fs/super.c false

            while IFS= read -r reject; do
              case "${reject}" in
                ./fs/exec.c.rej|./fs/namespace.c.rej|./fs/super.c.rej)
                  if ! grep -q '^@@' "${reject}"; then
                    echo "SUSFS reject has no patch hunk: ${reject}"
                    exit 1
                  fi
                  if ! grep '^+' "${reject}" | grep -Eqi 'susfs|cl_copy_mnt_ns|default_ksu_mnt'; then
                    echo "Unexpected SUSFS reject content: ${reject}"
                    exit 1
                  fi
                  rm -f "${reject}"
                  ;;
                *)
                  if ! grep -Fxq "${reject}" ../susfs-rejects-before.txt; then
                    echo "SUSFS patch has an unexpected reject: ${reject}"
                    exit 1
                  fi
                  ;;
              esac
            done < <(find . -type f -name '*.rej' -print)

            test -f include/linux/susfs_def.h
            if [[ "$(grep -o 'susfs_is_current_ksu_domain' fs/namespace.c | wc -l)" -lt 2 ]] || \
               [[ "$(grep -o 'CL_COPY_MNT_NS' fs/namespace.c | wc -l)" -lt 2 ]] || \
               [[ "$(grep -o 'susfs_is_current_ksu_domain' fs/super.c | wc -l)" -lt 2 ]] || \
               [[ "$(grep -o 'susfs_is_sdcard_android_data_not_decrypted' fs/super.c | wc -l)" -lt 2 ]]; then
              echo "A required SUSFS functional hunk is missing."
              exit 1
            fi
            grep -q 'DEFAULT_KSU_MNT_MINOR_DEV' fs/super.c
            if [[ "${patch_status}" -ne 0 ]]; then
              echo "SUSFS patch had expected source-context conflicts; compatibility repair completed."
            fi

          fi


          if [[ "${{ inputs.ksu_type }}" == *susfs ]]; then
            echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> arch/arm64/configs/gki_defconfig
          fi

          touch ./.scmversion
          sed -i "s|CONFIG_MODULE_SIG_PROTECT=y|CONFIG_MODULE_SIG_PROTECT=n|" arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_XATTR=y" >> arch/arm64/configs/gki_defconfig

          if [[ "${{ inputs.rom_source }}" != "YAAP-16" && "${{ inputs.rom_source }}" != "YAAP-17" && "${{ inputs.rom_source }}" != "DerpFest" ]]; then
            echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> arch/arm64/configs/gki_defconfig
          fi

          if [[ "${{ inputs.ccm }}" == "true" ]]; then
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BBR=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_NET_SCH_FQ=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BIC=n" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_WESTWOOD=n" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_HTCP=n" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_ECN=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_ECN=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IPV6_ECN=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_NF_TARGET_ECN=y" >> arch/arm64/configs/gki_defconfig
          fi

          if [[ "${{ inputs.netfilter }}" == "true" ]]; then
            echo "CONFIG_BPF_STREAM_PARSER=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_SET=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_MAX=65534" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_BITMAP_IP=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_BITMAP_PORT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IP=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPMARK=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPPORT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPMAC=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_MAC=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NET=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NETNET=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NETPORT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_LIST_SET=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP6_NF_NAT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> arch/arm64/configs/gki_defconfig
          fi

          if [[ "${{ inputs.netfilter }}" == "true" ]]; then
            echo "Applying IPv6_NAT Fix..."
            git apply ../patch/ipv6fix.patch
          fi

          if [[ -n "${{ inputs.kernel_name }}" ]]; then
            CUSTOM_NAME="${{ inputs.kernel_name }}"
            if [[ "${CUSTOM_NAME}" != -* ]]; then
              CUSTOM_NAME="-${CUSTOM_NAME}"
            fi
            echo "CONFIG_LOCALVERSION=\"${CUSTOM_NAME}\"" >> arch/arm64/configs/gki_defconfig
            echo "Kernel name set to: ${CUSTOM_NAME}"
          fi

          make O=out gki_defconfig vendor/pineapple_GKI.config vendor/oplus/pineapple_GKI.config

          if [[ "${{ inputs.rom_source }}" == "YAAP-17" ]]; then
            # WALT directly calls the Qualcomm hardware cycle counter.
            # Both components must be linked into Image.
            scripts/config --file out/.config \
              --disable SCHED_CASS --enable SCHED_WALT --disable SCHED_WALT_DEBUG \
              --enable ARM_QCOM_CPUFREQ_HW
            make O=out olddefconfig

            # /proc/config.gz uses gki-stock_defconfig in this source tree.
            # Preserve the actual build configuration and source revisions.
            mkdir -p ../build-info
            cp out/.config ../build-info/kernel.config
            git rev-parse HEAD > ../build-info/kernel-base-commit.txt
            git -C ../sm8650-modules rev-parse HEAD > ../build-info/modules-base-commit.txt
            git -C .. rev-parse HEAD > ../build-info/workflow-commit.txt
            clang --version > ../build-info/compiler.txt

            if ! grep -qxF 'CONFIG_SCHED_WALT=y' out/.config ||
               ! grep -qxF 'CONFIG_ARM_QCOM_CPUFREQ_HW=y' out/.config ||
               ! grep -qxF '# CONFIG_SCHED_CASS is not set' out/.config ||
               ! grep -qxF '# CONFIG_SCHED_WALT_DEBUG is not set' out/.config; then
              echo "::error::YAAP-17 requires built-in WALT and Qualcomm CPUFreq HW, with CASS and WALT_DEBUG disabled."
              exit 1
            fi
          fi

          make -j$(nproc) O=out Image

          if [[ "${{ inputs.rom_source }}" == "YAAP-17" ]]; then
            cp out/.config ../build-info/kernel.config
            cp out/modules.builtin ../build-info/modules.builtin
            # Kbuild prefixes the source path with the install directory kernel/.
            for builtin in kernel/kernel/sched/walt/sched-walt.ko kernel/drivers/cpufreq/qcom-cpufreq-hw.ko; do
              if ! grep -qxF "$builtin" out/modules.builtin; then
                echo "::error::$builtin is missing from the built-in module list; refusing to package Image."
                exit 1
              fi
            done
            (set -o pipefail
             llvm-nm --defined-only out/vmlinux | \
               awk '$NF == "qcom_cpufreq_get_cpu_cycle_counter" { print; found = 1 } END { exit !found }') \
               > ../build-info/walt-cycle-counter-symbol.txt
            (cd out/arch/arm64/boot && sha256sum Image) > ../build-info/Image.sha256
          fi

      - name: Make AnyKernel3
        run: |
          if [[ "${{ inputs.ksu_type }}" == "KernelSU-Official" ]]; then
            ZIP_PREFIX="KernelSU-Official"
          elif [[ "${{ inputs.ksu_type }}" == "KernelSU-Official-susfs" ]]; then
            ZIP_PREFIX="KernelSU-Official-SUSFS"
          elif [[ "${{ inputs.ksu_type }}" == "KernelSU-Next-susfs" ]]; then
            ZIP_PREFIX="KernelSU-Next-SUSFS"
          elif [[ "${{ inputs.ksu_type }}" == "KernelSU-Next" ]]; then
            ZIP_PREFIX="KernelSU-Next"
          elif [[ "${{ inputs.ksu_type }}" == "ReSukiSU" ]]; then
            ZIP_PREFIX="ReSukiSU"
          elif [[ "${{ inputs.ksu_type }}" == "ReSukiSU-susfs" ]]; then
            ZIP_PREFIX="ReSukiSU-SUSFS"
          elif [[ "${{ inputs.ksu_type }}" == "None" ]]; then
            ZIP_PREFIX="Non-KSU"
          fi

          # 添加 Droidspaces 标记
          if [[ "${{ inputs.droidspaces }}" == "standard" ]]; then
            ZIP_PREFIX="${ZIP_PREFIX}-dss"
          elif [[ "${{ inputs.droidspaces }}" == "extended" ]]; then
            ZIP_PREFIX="${ZIP_PREFIX}-dss-ext"
          fi

          ZIP_NAME="${{ inputs.rom_source }}-${ZIP_PREFIX}-$(date -u +"%m%d")"
          if [[ "${{ inputs.rom_source }}" == "YAAP-17" ]]; then
            # This revision supports all vendor_boot v4 ramdisk fragments.
            AK3_REV=020dfeccf9d7e962a48400fc94d3e451df92eead
            git init AnyKernel3
            git -C AnyKernel3 remote add origin https://github.com/osm0sis/AnyKernel3.git
            git -C AnyKernel3 fetch --depth=1 origin "$AK3_REV"
            git -C AnyKernel3 checkout --detach FETCH_HEAD
            # SM8650 cannot execute the template's 32-bit ARM tools.
            mkdir -p yaap-tools
            curl -fL --retry 3 --max-time 120 \
              https://raw.githubusercontent.com/AkiHaza/AnyKernel3/b96f1c0e35fcce583b916eb267ac0347d59b9629/tools/busybox \
              -o yaap-tools/busybox
            curl -fL --retry 3 --max-time 120 \
              https://github.com/topjohnwu/Magisk/releases/download/v31.0/Magisk-v31.0.apk \
              -o yaap-tools/Magisk-v31.0.apk
            echo '4d60ab3f5a59ebb2ca863f2f514e6924401b581e9b64f602665c008177626651  yaap-tools/busybox' | sha256sum -c -
            echo '2c8a488b9a5293e578e95ae4f07e3c57aba4feec4a52ca4dd852a2692d6dd4e8  yaap-tools/Magisk-v31.0.apk' | sha256sum -c -
            python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile

          tools = Path("yaap-tools")
          with ZipFile(tools / "Magisk-v31.0.apk") as apk:
              (tools / "magiskboot").write_bytes(apk.read("lib/arm64-v8a/libmagiskboot.so"))
          manifest = {
              "busybox": {
                  "source": "https://raw.githubusercontent.com/AkiHaza/AnyKernel3/b96f1c0e35fcce583b916eb267ac0347d59b9629/tools/busybox",
                  "version": "b96f1c0e35fcce583b916eb267ac0347d59b9629",
              },
              "magiskboot": {
                  "source": "https://github.com/topjohnwu/Magisk/releases/download/v31.0/Magisk-v31.0.apk#lib/arm64-v8a/libmagiskboot.so",
                  "version": "31.0",
              },
          }
          for name, metadata in manifest.items():
              metadata["sha256"] = hashlib.sha256((tools / name).read_bytes()).hexdigest()
          (tools / "toolchain.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
            python3 scripts/prepare_yaap_anykernel.py AnyKernel3 sm8650/out/arch/arm64/boot/Image \
              --busybox yaap-tools/busybox --magiskboot yaap-tools/magiskboot \
              --tool-info yaap-tools/toolchain.json
            cp yaap-tools/toolchain.json build-info/anykernel-tools.json
            printf '%s\n' "$AK3_REV" > build-info/anykernel-commit.txt
          else
            git clone --depth=1 https://github.com/AkiHaza/AnyKernel3.git
            cp sm8650/out/arch/arm64/boot/Image AnyKernel3/Image
          fi
          cd AnyKernel3
          zip -r9 ../"${ZIP_NAME}.zip" * -x .git

      - name: Upload YAAP-17 build evidence
        if: always() && inputs.rom_source == 'YAAP-17'
        uses: actions/upload-artifact@v6
        with:
          name: Kernel_Build_Info_YAAP-17
          path: build-info/
          if-no-files-found: warn

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v6
        with:
          name: Kernel_ZIP_${{ inputs.rom_source }}
          path: "*.zip"

  release:
    if: inputs.create_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@v7
        with:
          name: Kernel_ZIP_${{ inputs.rom_source }}
          path: ./release_zips

      - name: Set release env
        run: |
          TIME="$(date -u +'%y%m%d%H%M%S')"
          TIME_FORM="$(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV

          if [[ "${{ inputs.rom_source }}" == "YAAP-17" || "${{ inputs.rom_source }}" == "DerpFest" ]]; then
            CLANG_VERSION="clang-r596125"
            CLANG_URL="https://github.com/AkiHaza/Floran-Kernel/releases/download/toolchain-r596125/linux-x86-refs_heads_android17-release-clang-r596125.tar.gz"
          else
            CLANG_VERSION="clang-r563880c"
            CLANG_URL="https://github.com/AkiHaza/Floran-Kernel/releases/download/toolchain-r563880c/linux-x86-refs_heads_android16-qpr2-release-clang-r563880c.tar.gz"
          fi
          echo "CLANG_VERSION=$CLANG_VERSION" >> $GITHUB_ENV
          echo "CLANG_URL=$CLANG_URL" >> $GITHUB_ENV

          if [[ "${{ inputs.ksu_type }}" == "KernelSU-Official" ]]; then
            KSU_TYPENAME="KernelSU (Official)"
          elif [[ "${{ inputs.ksu_type }}" == "KernelSU-Official-susfs" ]]; then
            KSU_TYPENAME="KernelSU Official + SUSFS"
          elif [[ "${{ inputs.ksu_type }}" == "KernelSU-Next-susfs" ]]; then
            KSU_TYPENAME="KernelSU-Next + SUSFS"
          elif [[ "${{ inputs.ksu_type }}" == "KernelSU-Next" ]]; then
            KSU_TYPENAME="KernelSU-Next"
          elif [[ "${{ inputs.ksu_type }}" == "ReSukiSU" ]]; then
            KSU_TYPENAME="ReSukiSU"
          elif [[ "${{ inputs.ksu_type }}" == "ReSukiSU-susfs" ]]; then
            KSU_TYPENAME="ReSukiSU + SUSFS"
          elif [[ "${{ inputs.ksu_type }}" == "None" ]]; then
            KSU_TYPENAME="Non-KSU"
          fi

          # 添加 Droidspaces 信息
          if [[ "${{ inputs.droidspaces }}" == "standard" ]]; then
            KSU_TYPENAME="${KSU_TYPENAME} + Droidspaces"
          elif [[ "${{ inputs.droidspaces }}" == "extended" ]]; then
            KSU_TYPENAME="${KSU_TYPENAME} + Droidspaces Extended"
          fi

          echo "KSU_TYPENAME=${KSU_TYPENAME}" >> $GITHUB_ENV

          SOURCE="${{ inputs.rom_source }}"
          echo "REL_TAG=${SOURCE}-${{ inputs.ksu_type }}-${TIME}" >> $GITHUB_ENV
          echo "REL_TITLE=${SOURCE} | ${KSU_TYPENAME}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ env.REL_TAG }}"
          name: "${{ env.REL_TITLE }}"
          body: |

            | Field | Value |
            |---|---|
            | Source | ${{ inputs.rom_source }} |
            | Clang | [${{ env.CLANG_VERSION }}](${{ env.CLANG_URL }}) |
            | KernelSU | ${{ env.KSU_TYPENAME }} |
            | Droidspaces | ${{ inputs.droidspaces }} |
            | Built at | ${{ env.TIME_FORM }} |

            **Manager downloads:**
            - KernelSU (Official): [tiann/KernelSU](https://github.com/tiann/KernelSU)
            - KernelSU-Next: [KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next)
            - ReSukiSU: [ReSukiSU](https://github.com/ReSukiSU/ReSukiSU)
          draft: false
          prerelease: false
          files: release_zips/*.zip
