name: Build Kernel Core

on:
  workflow_call:
    inputs:
      android_version:
        description: Android version (16 or 17)
        required: true
        type: number

      rom_source:
        description: ROM Kernel Source Code
        required: true
        type: string

      ksu_type:
        description: "KernelSU Version"
        required: true
        type: string

      ksu_branch:
        description: KernelSU branch (empty uses the selected implementation default)
        required: false
        type: string
        default: ""

      susfs_dev:
        description: Use SUSFS android14-6.1 dev branch (false = stable)
        required: false
        type: boolean
        default: false

      netfilter:
        description: "Enable IPSET & IPv6_NAT"
        required: true
        type: boolean

      ccm:
        description: "Enable BBR & ECN"
        required: true
        type: boolean

      droidspaces:
        description: "Droidspaces Container Support"
        required: true
        type: string

      docker:
        description: "Docker Container Support (see patch/docker.config for DANGER notes)"
        required: false
        type: boolean
        default: false

      kernel_name:
        description: "Custom Kernel Name"
        required: false
        type: string
        default: ""

      create_release:
        description: "创建 GitHub Release？"
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev libdw-dev build-essential lz4 git python3 curl dwarves cpio gcc-aarch64-linux-gnu

      - name: Clone Kernel Source and Download Clang Toolchain
        run: |
          if [[ "${{ inputs.rom_source }}" == "YAAP" && "${{ inputs.android_version }}" == "16" ]]; then
            git clone --depth=1 -b sixteen https://github.com/AkiHaza/android_kernel_oneplus_sm8650.git sm8650
            git clone --depth=1 -b sixteen https://github.com/AkiHaza/android_kernel_oneplus_sm8650-modules.git sm8650-modules

          elif [[ "${{ inputs.rom_source }}" == "YAAP" && "${{ inputs.android_version }}" == "17" ]]; then
            git clone --depth=1 -b seventeen https://github.com/AkiHaza/android_kernel_oneplus_sm8650.git sm8650
            git clone --depth=1 -b seventeen https://github.com/AkiHaza/android_kernel_oneplus_sm8650-modules.git sm8650-modules

          elif [[ "${{ inputs.rom_source }}" == "DerpFest" && "${{ inputs.android_version }}" == "17" ]]; then
            git clone --depth=1 -b lineage-23.2 https://github.com/ppanzenboeck/android_kernel_oneplus_sm8650.git sm8650
            git clone --depth=1 -b derp16.2-arb https://github.com/ppanzenboeck/android_kernel_oneplus_sm8650-modules.git sm8650-modules

          elif [[ "${{ inputs.rom_source }}" == "LineageOS" && "${{ inputs.android_version }}" == "16" ]]; then
            git clone --depth=1 -b lineage-23.2 https://github.com/LineageOS/android_kernel_oneplus_sm8650.git sm8650
            git clone --depth=1 -b lineage-23.2 https://github.com/LineageOS/android_kernel_oneplus_sm8650-modules.git sm8650-modules

          elif [[ "${{ inputs.rom_source }}" == "LineageOS" && "${{ inputs.android_version }}" == "17" ]]; then
            git clone --depth=1 -b lineage-24.0 https://github.com/LineageOS/android_kernel_oneplus_sm8650.git sm8650
            git clone --depth=1 -b lineage-24.0 https://github.com/LineageOS/android_kernel_oneplus_sm8650-modules.git sm8650-modules

          elif [[ "${{ inputs.rom_source }}" == "FrierenKernel" && "${{ inputs.android_version }}" == "17" ]]; then
            git clone --depth=1 -b lineage-24.0 https://github.com/AkiHaza/custom_kernel_oneplus_sm8650.git sm8650
            git clone --depth=1 -b lineage-24.0 https://github.com/AkiHaza/custom_kernel_oneplus_sm8650-modules.git sm8650-modules

          elif [[ "${{ inputs.rom_source }}" == "Crdroid" && "${{ inputs.android_version }}" == "16" ]]; then
            git clone --depth=1 -b 16.0 https://github.com/crdroidandroid/android_kernel_oneplus_sm8650.git sm8650
            git clone --depth=1 -b 16.0 https://github.com/crdroidandroid/android_kernel_oneplus_sm8650-modules.git sm8650-modules

          elif [[ "${{ inputs.rom_source }}" == "Crdroid" && "${{ inputs.android_version }}" == "17" ]]; then
            git clone --depth=1 -b 17.0 https://github.com/crdroidandroid/android_kernel_oneplus_sm8650.git sm8650
            git clone --depth=1 -b 17.0 https://github.com/crdroidandroid/android_kernel_oneplus_sm8650-modules.git sm8650-modules

          elif [[ "${{ inputs.rom_source }}" == "PixelOS" && "${{ inputs.android_version }}" == "16" ]]; then
            git clone --depth=1 -b sixteen-qpr2 https://github.com/PixelOS-Devices/android_kernel_oneplus_sm8650.git sm8650
            git clone --depth=1 -b sixteen-qpr2 https://github.com/PixelOS-Devices/android_kernel_oneplus_sm8650-modules.git sm8650-modules

          elif [[ "${{ inputs.rom_source }}" == "AOSPA" && "${{ inputs.android_version }}" == "17" ]]; then
            git clone --depth=1 -b standalone https://github.com/AkiHaza/AOSPA_kernel_oneplus.git sm8650
            git clone --depth=1 -b standalone https://github.com/AkiHaza/AOSPA_kernel_oneplus_modules.git sm8650/sm8650-modules

          else
            echo "Unsupported ROM source for Android ${{ inputs.android_version }}: ${{ inputs.rom_source }}" >&2
            exit 1
          fi

          if [[ "${{ inputs.android_version }}" == "17" ]]; then
            CLANG_VERSION="clang-r596125"
            CLANG_URL="https://github.com/AkiHaza/Floran-Kernel/releases/download/toolchain-r596125/linux-x86-refs_heads_android17-release-clang-r596125.tar.gz"
          else
            CLANG_VERSION="clang-r563880c"
            CLANG_URL="https://github.com/AkiHaza/Floran-Kernel/releases/download/toolchain-r563880c/linux-x86-refs_heads_android16-qpr2-release-clang-r563880c.tar.gz"
          fi

          mkdir -p "toolchains/${CLANG_VERSION}"
          cd toolchains
          echo "Downloading ${CLANG_VERSION} from ${CLANG_URL}"
          curl -fL --retry 3 --retry-delay 2 -o "${CLANG_VERSION}.tar.gz" "${CLANG_URL}"
          tar -xf "${CLANG_VERSION}.tar.gz" -C "${CLANG_VERSION}"
          {
            echo "### Clang toolchain"
            echo "- Version: ${CLANG_VERSION}"
            echo "- Download: ${CLANG_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Apply Droidspaces patches
        if: inputs.droidspaces != 'none' && inputs.rom_source != 'YAAP'
        run: |
          cd sm8650

          echo ">>> 正在添加 Droidspaces 容器支持..."
          # 开启 Droidspaces 容器所需内核支持
          echo "CONFIG_PID_NS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_IPC_NS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USER_NS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_SYSVIPC=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_DEVTMPFS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NAMESPACES=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_POSIX_MQUEUE=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> ./arch/arm64/configs/gki_defconfig
          # 开启 NTSync
          echo "CONFIG_NTSYNC=y" >> ./arch/arm64/configs/gki_defconfig

          # 应用 Droidspaces 容器必须补丁
          echo ">>> 应用 Droidspaces 补丁..."
          if [[ "${{ inputs.rom_source }}" == "DerpFest" ]]; then
            patch -p1 -F 3 < ../patch/fix_sysvipc_kabi_6_7_8.patch
            patch -p1 -F 3 < ../patch/ntsync_base.patch
            patch -p1 -F 3 < ../patch/ntsync_compat_android14-6.1.patch
            echo "Droidspaces patches applied to DerpFest."
          else
            patch -p1 -F 3 < ../patch/fix_sysvipc_kabi_6_7_8.patch || true
            patch -p1 -F 3 < ../patch/ntsync_base.patch || true
            patch -p1 -F 3 < ../patch/ntsync_compat_android14-6.1.patch || true
          fi

      - name: Apply Droidspaces Extended patches
        if: inputs.droidspaces == 'extended' && inputs.rom_source != 'YAAP'
        run: |
          cd sm8650

          echo ">>> 正在启用容器环境扩展支持..."
          # 开启虚拟 HCI 设备支持
          echo "CONFIG_BT_HCIVHCI=y" >> arch/arm64/configs/gki_defconfig
          # 开启 systemd-coredump 支持
          echo "CONFIG_STATIC_USERMODEHELPER=n" >> arch/arm64/configs/gki_defconfig
          # 添加 Lindroid EVDI DRM 驱动
          echo "CONFIG_DRM_LINDROID_EVDI=y" >> arch/arm64/configs/gki_defconfig

          # 应用 EVDI DRM 补丁
          if [[ "${{ inputs.rom_source }}" == "DerpFest" ]]; then
            patch -p1 -F 3 < ../patch/evdi_drm.patch
            echo "Droidspaces Extended patch applied to DerpFest."
          else
            patch -p1 -F 3 < ../patch/evdi_drm.patch || true
          fi

      - name: Apply Docker support
        if: inputs.docker
        run: |
          cd sm8650

          echo ">>> 正在启用 Docker 容器支持（能力清单与 DANGER 说明见 patch/docker.config 头）..."
          cat ../patch/docker.config >> arch/arm64/configs/gki_defconfig
          # fix_cgroup.patch 是 LXC/Droidspaces 专用源码补丁，仅在同时启用 Droidspaces 时套用（纯 Docker 不碰源码）。
          if [[ "${{ inputs.droidspaces }}" != "none" ]]; then
            echo ">>> Droidspaces 已启用，应用 fix_cgroup.patch..."
            patch -p1 -F 3 < ../patch/fix_cgroup.patch || true
          fi

      - name: Fix extract-cert key_pass compatibility
        if: inputs.rom_source != 'YAAP' || inputs.android_version != 16
        run: |
          cd sm8650
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("certs/extract-cert.c")
          text = path.read_text()
          guard = r"(?:#ifdef\s+USE_PKCS11_ENGINE|#if\s+defined\s*\(\s*USE_PKCS11_ENGINE\s*\))"
          declaration = re.compile(
              rf"(?m)^(?P<indent>[ \t]*){guard}[ \t]*\r?\n"
              r"(?P<body>[ \t]*)static\s+const\s+char\s+\*\s*key_pass\s*;[ \t]*\r?\n"
              r"(?P=indent)#endif[ \t]*(?:\r?\n|$)"
          )
          assignment = re.compile(
              rf"(?m)^(?P<indent>[ \t]*){guard}[ \t]*\r?\n"
              r"(?P<body>[ \t]*)key_pass\s*=\s*getenv\s*\(\s*"
              r"\"KBUILD_SIGN_PIN\"\s*\)\s*;[ \t]*\r?\n"
              r"(?P=indent)#endif[ \t]*(?:\r?\n|$)"
          )

          text, declaration_count = declaration.subn(
              lambda match: f"{match.group('body')}static const char *key_pass;\n",
              text,
              count=1,
          )
          text, assignment_count = assignment.subn(
              lambda match: f'{match.group("body")}key_pass = getenv("KBUILD_SIGN_PIN");\n',
              text,
              count=1,
          )

          if declaration_count or assignment_count:
              path.write_text(text)
              print("Fixed extract-cert.c key_pass guards")
          else:
              print("extract-cert.c key_pass layout is already compatible")
          PY

      - name: Compile Kernel
        env:
          KSU_TYPE: ${{ inputs.ksu_type }}
          KSU_BRANCH: ${{ inputs.ksu_branch }}
          SUSFS_DEV: ${{ inputs.susfs_dev }}
        run: |
          if [[ "${{ inputs.android_version }}" == "17" ]]; then
            CLANG_VERSION="clang-r596125"
          else
            CLANG_VERSION="clang-r563880c"
          fi
          CLANG_ROOT="${GITHUB_WORKSPACE}/toolchains/${CLANG_VERSION}/bin"
          export PATH="${CLANG_ROOT}:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang CXX=clang++ HOSTCC=clang HOSTCXX=clang++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          echo "Using ${CLANG_VERSION}: $(clang --version | head -n 1)"

          cd sm8650

          bash ../.github/scripts/setup-kernelsu.sh "$KSU_TYPE" "$KSU_BRANCH"

          if [[ "${{ inputs.ksu_type }}" == "KernelSU-Official-susfs" ]]; then
            bash ../.github/scripts/integrate-susfs.sh source "${{ inputs.ksu_type }}"
          elif [[ "${{ inputs.ksu_type }}" == *susfs ]]; then
            # Apply the selected SUSFS android14-6.1 stable/dev patch.
            source ../.github/scripts/susfs-source.sh
            prepare_susfs_source "${SUSFS_DEV:-false}"
            cp susfs/kernel_patches/fs/* fs/
            cp susfs/kernel_patches/include/linux/* include/linux/

            # Adapt the stack-allocated bprm in YAAP and verify every SUSFS hunk
            # before changing the live kernel source. Unknown rejects are fatal.
            python3 ../.github/scripts/apply-susfs-kernel.py \
              "$SUSFS_PATCH"

          fi

          if [[ "${{ inputs.ksu_type }}" == "KernelSU-Official-susfs" ]]; then
            echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          fi
          if [[ "${{ inputs.ksu_type }}" == *susfs ]]; then
            bash ../.github/scripts/patch-susfs-optional-helpers.sh
            echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> arch/arm64/configs/gki_defconfig
          fi

          touch ./.scmversion
          sed -i "s|CONFIG_MODULE_SIG_PROTECT=y|CONFIG_MODULE_SIG_PROTECT=n|" arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_XATTR=y" >> arch/arm64/configs/gki_defconfig

          if [[ "${{ inputs.rom_source }}" != "YAAP" && "${{ inputs.rom_source }}" != "DerpFest" && "${{ inputs.rom_source }}" != "FrierenKernel" ]]; then
            echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> arch/arm64/configs/gki_defconfig
          fi

          if [[ "${{ inputs.ccm }}" == "true" && "${{ inputs.rom_source }}" != "FrierenKernel" ]]; then
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BBR=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_NET_SCH_FQ=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BIC=n" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_WESTWOOD=n" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_HTCP=n" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_ECN=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_ECN=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IPV6_ECN=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_NF_TARGET_ECN=y" >> arch/arm64/configs/gki_defconfig
          fi

          if [[ "${{ inputs.netfilter }}" == "true" && "${{ inputs.rom_source }}" != "FrierenKernel" ]]; then
            echo "CONFIG_BPF_STREAM_PARSER=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_SET=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_MAX=65534" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_BITMAP_IP=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_BITMAP_PORT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IP=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPMARK=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPPORT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPMAC=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_MAC=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NET=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NETNET=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NETPORT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_LIST_SET=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP6_NF_NAT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> arch/arm64/configs/gki_defconfig
          fi

          if [[ "${{ inputs.netfilter }}" == "true" && "${{ inputs.rom_source }}" != "FrierenKernel" ]]; then
            if git apply --check ../patch/ipv6fix.patch >/dev/null 2>&1; then
              echo "Applying IPv6_NAT Fix..."
              git apply ../patch/ipv6fix.patch
            elif git apply --reverse --check ../patch/ipv6fix.patch >/dev/null 2>&1; then
              echo "IPv6_NAT Fix is already present."
            else
              echo "IPv6_NAT Fix is not compatible with this kernel source; keeping the source config_data implementation."
            fi
          fi

          if [[ -n "${{ inputs.kernel_name }}" ]]; then
            CUSTOM_NAME="${{ inputs.kernel_name }}"
            if [[ "${CUSTOM_NAME}" != -* ]]; then
              CUSTOM_NAME="-${CUSTOM_NAME}"
            fi
            echo "CONFIG_LOCALVERSION=\"${CUSTOM_NAME}\"" >> arch/arm64/configs/gki_defconfig
            echo "Kernel name set to: ${CUSTOM_NAME}"
          fi

          make O=out gki_defconfig vendor/pineapple_GKI.config vendor/oplus/pineapple_GKI.config
          if [[ "${{ inputs.ksu_type }}" == "KernelSU-Official-susfs" ]]; then
            bash ../.github/scripts/integrate-susfs.sh config out
          fi
          make -j$(nproc) O=out Image
          if [[ "${{ inputs.ksu_type }}" == "KernelSU-Official-susfs" ]]; then
            bash ../.github/scripts/integrate-susfs.sh built out
          fi

      - name: Upload SUSFS verification evidence
        if: ${{ success() && inputs.ksu_type == 'KernelSU-Official-susfs' }}
        uses: actions/upload-artifact@v6
        with:
          name: SUSFS_Evidence_A${{ inputs.android_version }}_${{ inputs.rom_source }}_${{ inputs.ksu_type }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            sm8650/out/.config
            sm8650/out/System.map

      - name: Make AnyKernel3
        run: |
          if [[ "${{ inputs.ksu_type }}" == "KernelSU-Official" ]]; then
            ZIP_PREFIX="KernelSU-Official"
          elif [[ "${{ inputs.ksu_type }}" == "KernelSU-Official-susfs" ]]; then
            ZIP_PREFIX="KernelSU-Official-SUSFS"
          elif [[ "${{ inputs.ksu_type }}" == "KernelSU-Next-susfs" ]]; then
            ZIP_PREFIX="KernelSU-Next-SUSFS"
          elif [[ "${{ inputs.ksu_type }}" == "KernelSU-Next" ]]; then
            ZIP_PREFIX="KernelSU-Next"
          elif [[ "${{ inputs.ksu_type }}" == "BakaSU" ]]; then
            ZIP_PREFIX="BakaSU"
          elif [[ "${{ inputs.ksu_type }}" == "BakaSU-susfs" ]]; then
            ZIP_PREFIX="BakaSU-SUSFS"
          elif [[ "${{ inputs.ksu_type }}" == "None" ]]; then
            ZIP_PREFIX="Non-KSU"
          fi

          # 添加 Droidspaces 标记
          if [[ "${{ inputs.droidspaces }}" == "standard" ]]; then
            ZIP_PREFIX="${ZIP_PREFIX}-dss"
          elif [[ "${{ inputs.droidspaces }}" == "extended" ]]; then
            ZIP_PREFIX="${ZIP_PREFIX}-dss-ext"
          fi

          # 添加 Docker 标记
          if [[ "${{ inputs.docker }}" == "true" ]]; then
            ZIP_PREFIX="${ZIP_PREFIX}-docker"
          fi

          ZIP_NAME="${{ inputs.rom_source }}-A${{ inputs.android_version }}-${ZIP_PREFIX}-$(date -u +"%m%d")"
          git clone --depth=1 https://github.com/AkiHaza/AnyKernel3.git
          cp sm8650/out/arch/arm64/boot/Image AnyKernel3/Image
          cd AnyKernel3
          zip -r9 ../"${ZIP_NAME}.zip" * -x .git

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v6
        with:
          name: Kernel_ZIP_A${{ inputs.android_version }}_${{ inputs.rom_source }}
          path: "*.zip"

  release:
    if: inputs.create_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@v7
        with:
          name: Kernel_ZIP_A${{ inputs.android_version }}_${{ inputs.rom_source }}
          path: ./release_zips

      - name: Set release env
        run: |
          TIME="$(date -u +'%y%m%d%H%M%S')"
          TIME_FORM="$(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV

          if [[ "${{ inputs.android_version }}" == "17" ]]; then
            CLANG_VERSION="clang-r596125"
            CLANG_URL="https://github.com/AkiHaza/Floran-Kernel/releases/download/toolchain-r596125/linux-x86-refs_heads_android17-release-clang-r596125.tar.gz"
          else
            CLANG_VERSION="clang-r563880c"
            CLANG_URL="https://github.com/AkiHaza/Floran-Kernel/releases/download/toolchain-r563880c/linux-x86-refs_heads_android16-qpr2-release-clang-r563880c.tar.gz"
          fi
          echo "CLANG_VERSION=$CLANG_VERSION" >> $GITHUB_ENV
          echo "CLANG_URL=$CLANG_URL" >> $GITHUB_ENV

          if [[ "${{ inputs.ksu_type }}" == "KernelSU-Official" ]]; then
            KSU_TYPENAME="KernelSU (Official)"
          elif [[ "${{ inputs.ksu_type }}" == "KernelSU-Official-susfs" ]]; then
            KSU_TYPENAME="KernelSU Official + SUSFS"
          elif [[ "${{ inputs.ksu_type }}" == "KernelSU-Next-susfs" ]]; then
            KSU_TYPENAME="KernelSU-Next + SUSFS"
          elif [[ "${{ inputs.ksu_type }}" == "KernelSU-Next" ]]; then
            KSU_TYPENAME="KernelSU-Next"
          elif [[ "${{ inputs.ksu_type }}" == "BakaSU" ]]; then
            KSU_TYPENAME="BakaSU"
          elif [[ "${{ inputs.ksu_type }}" == "BakaSU-susfs" ]]; then
            KSU_TYPENAME="BakaSU + SUSFS"
          elif [[ "${{ inputs.ksu_type }}" == "None" ]]; then
            KSU_TYPENAME="Non-KSU"
          fi

          # 添加 Droidspaces 信息
          if [[ "${{ inputs.droidspaces }}" == "standard" ]]; then
            KSU_TYPENAME="${KSU_TYPENAME} + Droidspaces"
          elif [[ "${{ inputs.droidspaces }}" == "extended" ]]; then
            KSU_TYPENAME="${KSU_TYPENAME} + Droidspaces Extended"
          fi

          echo "KSU_TYPENAME=${KSU_TYPENAME}" >> $GITHUB_ENV

          SOURCE="${{ inputs.rom_source }}"
          echo "REL_TAG=${SOURCE}-A${{ inputs.android_version }}-${{ inputs.ksu_type }}-${TIME}" >> $GITHUB_ENV
          echo "REL_TITLE=${SOURCE} | Android ${{ inputs.android_version }} | ${KSU_TYPENAME}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ env.REL_TAG }}"
          name: "${{ env.REL_TITLE }}"
          body: |

            | Field | Value |
            |---|---|
            | Source | ${{ inputs.rom_source }} |
            | Android | ${{ inputs.android_version }} |
            | Clang | [${{ env.CLANG_VERSION }}](${{ env.CLANG_URL }}) |
            | KernelSU | ${{ env.KSU_TYPENAME }} |
            | Droidspaces | ${{ inputs.droidspaces }} |
            | Built at | ${{ env.TIME_FORM }} |

            **Manager downloads:**
            - KernelSU (Official): [tiann/KernelSU](https://github.com/tiann/KernelSU)
            - KernelSU-Next: [KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next)
            - BakaSU: [BakaSU](https://github.com/Baka-SU/BakaSU)
          draft: false
          prerelease: false
          files: release_zips/*.zip
